<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planificador de Estudios</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="header">
      <div class="saludo">
        <h1>Hola, [Nombre] 👋</h1>
        <p>Jueves, 1 de octubre de 2026</p>
      </div>
      <div class="perfil"></div>
    </header>

    <div class="banner-inteligente">
      <span class="icono">🧠</span>
      <p>He repartido tus horas libres de hoy. CED y ADE tienen prioridad porque sus exámenes están más cerca.</p>
    </div>

    <main class="grid-principal">
      <section class="seccion-timeline">
        <h2>Plan sugerido para hoy</h2>
        <div id="contenedor-plan" class="timeline">
          <!-- El JavaScript inyectará las tarjetas aquí -->
        </div>
      </section>

      <section class="seccion-contexto">
        <h2>Próximos objetivos</h2>
        <ul class="lista-examenes">
          <li>
            <div class="fecha-etiqueta roja">21 Oct</div>
            <div class="info"><strong>CED</strong><span>Alta dificultad</span></div>
          </li>
          <li>
            <div class="fecha-etiqueta naranja">23 Oct</div>
            <div class="info"><strong>ADE</strong><span>Dificultad media</span></div>
          </li>
          <li>
            <div class="fecha-etiqueta azul">26 Oct</div>
            <div class="info"><strong>FP</strong><span>Alta dificultad</span></div>
          </li>
        </ul>
      </section>
    </main>
  </div>

  <!-- Aquí conectamos el cerebro matemático -->
  <script src="script.js"></script>
</body>
</html>
